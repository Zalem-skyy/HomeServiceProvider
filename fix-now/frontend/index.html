<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#007bff">
    <title>Fix Now - Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 400px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .container h2 { text-align: center; color: #007bff; font-size: 28px; margin-bottom: 5px; margin-top: 0; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #218838; }
        
        .password-container { display: flex; align-items: center; font-size: 13px; margin-top: -5px; margin-bottom: 10px; color: #555; }
        .password-container input { margin-right: 8px; width: auto; cursor: pointer; }
        
        .toggle-text { text-align: center; font-size: 14px; margin-top: 20px; cursor: pointer; color: #007bff; font-weight: bold; }
        .toggle-text:hover { text-decoration: underline; }
        #message { text-align: center; font-weight: bold; margin-top: 15px; font-size: 14px; }
    </style>
    <!-- Link the Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Register the Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'));
        }
    </script>
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

    <!-- Login Form -->
    <div class="container" id="loginContainer">
        <h2>Fix Now</h2>
        <div class="subtitle">One account to hire pros or offer your services.</div>
        
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email Address" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            
            <div class="password-container">
                <input type="checkbox" id="showLoginPass" onclick="togglePassword('loginPassword')"> 
                <label for="showLoginPass" style="cursor: pointer;">Show Password</label>
            </div>

            <button type="submit">Log In</button>
        </form>
        <div class="toggle-text" onclick="toggleForms()">Need an account? Sign up</div>
    </div>

    <!-- Registration Form -->
    <div class="container" id="registerContainer" style="display: none;">
        <h2>Join Fix Now</h2>
        <div class="subtitle">Create a universal account to get started.</div>
        
        <form id="registerForm">
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="email" id="regEmail" placeholder="Email Address" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            
            <div class="password-container">
                <input type="checkbox" id="showRegPass" onclick="togglePassword('regPassword')"> 
                <label for="showRegPass" style="cursor: pointer;">Show Password</label>
            </div>

            <button type="submit">Sign Up</button>
        </form>
        <div class="toggle-text" onclick="toggleForms()">Already have an account? Log in</div>
    </div>

    <div id="message"></div>

    <script src="js/auth.js"></script>
    <script src="js/dark-mode.js"></script>
</body>
</html>
