<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Now - Welcome</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .landing-container { 
            max-width: 400px; 
            width: 100%; 
            background: white; 
            padding: 30px 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
        }
        .logo { 
            font-size: 32px; 
            color: #007bff; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        .tagline { 
            color: #666; 
            font-size: 15px; 
            margin-bottom: 30px; 
        }
        
        .role-card { 
            background: #f9f9f9; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            padding: 20px; 
            margin-bottom: 20px; 
            transition: transform 0.2s ease;
        }
        .role-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .role-card h3 { margin: 0 0 10px; color: #333; }
        .role-card p { font-size: 13px; color: #555; margin: 0 0 15px; line-height: 1.4; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 12px; 
            color: white; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            box-sizing: border-box; 
        }
        .btn-customer { background: #28a745; }
        .btn-customer:hover { background: #218838; }
        .btn-provider { background: #007bff; }
        .btn-provider:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="landing-container">
        <div class="logo">Fix Now</div>
        <div class="tagline">Your trusted home service marketplace.</div>

        <!-- Customer Section -->
        <div class="role-card">
            <h3>I need a service</h3>
            <p>Find trusted plumbers, electricians, cleaners, and more to fix up your home.</p>
            <a href="customer-auth.html" class="btn btn-customer">Customer Portal</a>
        </div>

        <!-- Provider Section -->
        <div class="role-card">
            <h3>I am a professional</h3>
            <p>Join our platform to find jobs, manage your bookings, and grow your business.</p>
            <a href="provider-auth.html" class="btn btn-provider">Provider Portal</a>
        </div>
    </div>

</body>
</html>
