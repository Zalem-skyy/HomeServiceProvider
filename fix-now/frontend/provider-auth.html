<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Now - Provider Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #e9ecef; padding: 50px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .container h2 { text-align: center; color: #333; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        #message { text-align: center; font-weight: bold; margin-top: 15px; }
        .toggle-text { text-align: center; font-size: 13px; margin-top: 15px; cursor: pointer; color: #007bff; }
    </style>
</head>
<body>

    <!-- Registration Form -->
    <div class="container" id="registerContainer">
        <h2>Provider Sign Up</h2>
        <form id="providerRegisterForm">
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            <select id="regCategory" required>
                <option value="" disabled selected>Select your trade...</option>
                <option value="Plumbers">Plumbers</option>
                <option value="Electricians">Electricians</option>
                <option value="Cleaners">Cleaners</option>
                <option value="Carpenters">Carpenters</option>
                <option value="Painters">Painters</option>
            </select>
            <button type="submit">Register as Provider</button>
        </form>
        <div class="toggle-text" onclick="toggleForms()">Already have an account? Log in</div>
    </div>

    <!-- Login Form -->
    <div class="container" id="loginContainer" style="display: none;">
        <h2>Provider Login</h2>
        <form id="providerLoginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="toggle-text" onclick="toggleForms()">Need an account? Sign up</div>
    </div>

    <div id="message"></div>

    <script src="js/provider-auth.js"></script>
</body>
</html>
