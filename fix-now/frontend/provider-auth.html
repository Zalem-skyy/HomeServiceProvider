<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Now - Become a Professional</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; margin: 0; display: flex; justify-content: center; }
        .container { max-width: 400px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .container h2 { text-align: center; color: #333; margin-top: 0; }
        .container p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        
        label { font-weight: bold; font-size: 13px; color: #333; margin-top: 10px; display: block; }
        select, input[type="text"] { width: 100%; padding: 12px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        
        .location-group { display: flex; gap: 5px; }
        .location-group input { margin-bottom: 0; }
        .location-group button { background: #e9ecef; border: 1px solid #ccc; border-radius: 6px; padding: 0 15px; cursor: pointer; font-size: 16px; margin: 8px 0 15px; }

        .submit-btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;}
        .submit-btn:hover { background: #0056b3; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
        
        #message { text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Join as a Professional</h2>
        <p class="subtitle">Start receiving booking requests from customers in your area.</p>
        
        <form id="becomeProviderForm">
            <label for="regCategory">What is your primary trade?</label>
            <select id="regCategory" required>
                <option value="" disabled selected>Select a service...</option>
                <option value="Plumbers">Plumbers</option>
                <option value="Electricians">Electricians</option>
                <option value="Cleaners">Cleaners</option>
                <option value="Carpenters">Carpenters</option>
                <option value="Painters">Painters</option>
                <option value="Appliances">Appliances</option>
                <option value="Pest Control">Pest Control</option>
                <option value="Movers">Movers</option>
            </select>

            <label for="regLocation">Where do you work?</label>
            <div class="location-group">
                <input type="text" id="regLocation" placeholder="City" required>
                <button type="button" onclick="detectProviderLocation()" title="Detect My Location">📍</button>
            </div>

            <button type="submit" class="submit-btn">Enable Provider Profile</button>
        </form>

        <div id="message"></div>
        <a href="user-dash.html" class="back-link">&larr; Back to Dashboard</a>
    </div>

    <script src="js/provider-auth.js"></script>
</body>
</html>
