<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Now - Customer Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 50px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .container h2 { text-align: center; color: #333; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;}
        button:hover { background: #218838; }
        #message { text-align: center; font-weight: bold; margin-top: 15px; }
        
        /* Toggle and UX styles */
        .toggle-text { text-align: center; font-size: 13px; margin-top: 15px; cursor: pointer; color: #007bff; }
        .password-container { display: flex; align-items: center; font-size: 13px; margin-top: -5px; margin-bottom: 10px; color: #555; }
        .password-container input { margin-right: 8px; width: auto; cursor: pointer; }
        .provider-link { text-align: center; margin-top: 30px; font-size: 14px; }
        .provider-link a { color: #666; text-decoration: none; font-weight: bold; }
        .provider-link a:hover { color: #333; }
    </style>
</head>
<body>

    <!-- Login Form -->
    <div class="container" id="loginContainer">
        <h2>Customer Login</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            
            <!-- Show Password Toggle -->
            <div class="password-container">
                <input type="checkbox" id="showLoginPass" onclick="togglePassword('loginPassword')"> 
                <label for="showLoginPass" style="cursor: pointer;">Show Password</label>
            </div>

            <button type="submit">Log In</button>
        </form>
        <div class="toggle-text" onclick="toggleForms()">Need an account? Sign up</div>
    </div>

    <!-- Registration Form -->
    <div class="container" id="registerContainer" style="display: none;">
        <h2>Customer Sign Up</h2>
        <form id="registerForm">
            <input type="text" id="regName" placeholder="Full Name" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            
            <!-- Show Password Toggle -->
            <div class="password-container">
                <input type="checkbox" id="showRegPass" onclick="togglePassword('regPassword')"> 
                <label for="showRegPass" style="cursor: pointer;">Show Password</label>
            </div>

            <button type="submit">Sign Up</button>
        </form>
        <div class="toggle-text" onclick="toggleForms()">Already have an account? Log in</div>
    </div>

    <div id="message"></div>

    <!-- Portal Switcher -->
    <div class="provider-link">
        <a href="provider-auth.html">Are you a service provider? Log in here &rarr;</a>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
