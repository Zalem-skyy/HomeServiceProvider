<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix Now - Providers</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 400px; background-color: white; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        
        /* Header */
        .header { display: flex; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .back-btn { font-size: 24px; text-decoration: none; color: #333; margin-right: 15px; cursor: pointer; }
        .header h2 { margin: 0; font-size: 20px; }

        /* Provider Card */
        .provider-card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 15px; display: flex; align-items: center; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .avatar { width: 50px; height: 50px; background-color: #ccc; border-radius: 50%; margin-right: 15px; }
        .info { flex-grow: 1; }
        .info h4 { margin: 0 0 5px; font-size: 16px; }
        .info p { margin: 0; font-size: 13px; color: #666; }
        .rating { color: #f5b50a; font-weight: bold; font-size: 12px; margin-top: 5px; }
        .book-btn { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .book-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <a href="user-dash.html" class="back-btn">&larr;</a>
            <h2 id="categoryTitle">Loading...</h2>
        </div>

        <!-- Provider List Container -->
        <div id="providerList">
            <!-- Providers will be injected here by JavaScript -->
        </div>
    </div>

    <script src="js/provider-list.js"></script>
</body>
</html>
